<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1132" viewBox="0 0 800 1132"><rect width="800" height="1132" fill="#fff"/><rect x="35" y="35" width="730" height="1062" rx="16" fill="none" stroke="#6f9660" stroke-width="2"/><g font-family="Noto Sans Thai,Tahoma,sans-serif"><text x="400" y="100" text-anchor="middle" font-size="34" fill="#6f9660">โลกของพืช</text><text x="400" y="138" text-anchor="middle" font-size="18" fill="#8d7c99">วิทยาศาสตร์ • ป.3 • ใบงานจากคลังสื่อครูแหวน</text><text x="65" y="182" font-size="18" fill="#8d7c99">ชื่อ _________________________ ชั้น ______ เลขที่ ______</text><text x="65" y="230" font-size="22" fill="#49414d">1. วาดภาพต้นไม้หนึ่งต้น พร้อมระบุส่วนประกอบ</text><path d="M65 290H735M65 335H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="390" font-size="22" fill="#49414d">2. รากของพืชมีหน้าที่อะไร?</text><path d="M65 450H735M65 495H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="550" font-size="22" fill="#49414d">3. ใบของพืชมีหน้าที่อะไร?</text><path d="M65 610H735M65 655H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="710" font-size="22" fill="#49414d">4. พืชต้องการสิ่งใดบ้างในการเจริญเติบโต?</text><path d="M65 770H735M65 815H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="870" font-size="22" fill="#49414d">5. เขียนวิธีดูแลต้นไม้ที่บ้านของนักเรียน</text><path d="M65 930H735M65 975H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="400" y="1070" text-anchor="middle" font-size="16" fill="#6f9660">เรียนรู้อย่างสนุก ค่อย ๆ คิด แล้วลงมือทำ ♡</text></g></svg>