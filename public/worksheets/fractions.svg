<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1132" viewBox="0 0 800 1132"><rect width="800" height="1132" fill="#fff"/><rect x="35" y="35" width="730" height="1062" rx="16" fill="none" stroke="#8260b3" stroke-width="2"/><g font-family="Noto Sans Thai,Tahoma,sans-serif"><text x="400" y="100" text-anchor="middle" font-size="34" fill="#8260b3">เศษส่วนแสนสนุก</text><text x="400" y="138" text-anchor="middle" font-size="18" fill="#8d7c99">คณิตศาสตร์ • ป.4 • ใบงานจากคลังสื่อครูแหวน</text><text x="65" y="182" font-size="18" fill="#8d7c99">ชื่อ _________________________ ชั้น ______ เลขที่ ______</text><text x="65" y="230" font-size="22" fill="#49414d">1. วาดวงกลมแล้วระบายสีแสดงเศษส่วน 1/2</text><path d="M65 290H735M65 335H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="390" font-size="22" fill="#49414d">2. วาดสี่เหลี่ยมแล้วระบายสีแสดงเศษส่วน 3/4</text><path d="M65 450H735M65 495H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="550" font-size="22" fill="#49414d">3. เปรียบเทียบ 1/2 กับ 1/4 จำนวนใดมากกว่า?</text><path d="M65 610H735M65 655H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="710" font-size="22" fill="#49414d">4. คำนวณ 1/4 + 2/4 = __________</text><path d="M65 770H735M65 815H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="65" y="870" font-size="22" fill="#49414d">5. เขียนเศษส่วนที่พบในชีวิตประจำวัน 1 ตัวอย่าง</text><path d="M65 930H735M65 975H735" stroke="#ded9e2" stroke-dasharray="4 5"/><text x="400" y="1070" text-anchor="middle" font-size="16" fill="#8260b3">เรียนรู้อย่างสนุก ค่อย ๆ คิด แล้วลงมือทำ ♡</text></g></svg>